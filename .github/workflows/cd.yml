name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/lntck/fastapi-jwt-auth:latest .

      - name: Push image
        run: |
          docker push ghcr.io/lntck/fastapi-jwt-auth:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}

          script: |
            set -e

            cd /root/projects/fastapi-jwt-auth

            echo "Pulling new image..."
            docker-compose -f docker-compose.prod.yml pull

            echo "Running migrations..."
            docker-compose -f docker-compose.prod.yml run --rm -T app sh -c "alembic upgrade head"

            echo "Starting services..."
            docker-compose -f docker-compose.prod.yml up -d

            echo "Waiting for startup..."
            sleep 10

            echo "Checking readiness..."
            curl -f http://127.0.0.1:8000/health/ready

            echo "Cleaning old images..."
            docker image prune -f